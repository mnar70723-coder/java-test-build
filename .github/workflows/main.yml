name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $pass = ConvertTo-SecureString "P@ssw0rd2026!SecureRDP" -AsPlainText -Force
          New-LocalUser -Name "RDPAdmin" -Password $pass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPAdmin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPAdmin"
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASS=P@ssw0rd2026!SecureRDP"

      - name: Install Tailscale
        shell: powershell
        run: |
          $msiPath = Join-Path -Path$env:TEMP -ChildPath "tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          Remove-Item -Path $msiPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsPath up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID$tsIP = $null$retries = 0
          while (-not $tsIP -and$retries -lt 10) {
              $tsIP = &$tsPath ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName$env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Configure Desktop & Maintain Connection
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'TaskbarSmallIcons' -Value 1 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'LogPixels' -Value 96 -ErrorAction SilentlyContinue
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          
          Write-Host "=========================================="
          Write-Host "RDP BAGLANTISI HAZIR"
          Write-Host "IP Adresi : $env:TAILSCALE_IP"
          Write-Host "Kullanici : RDPAdmin"
          Write-Host "Sifre     : $env:RDP_PASS"
          Write-Host "=========================================="
          
          while ($true) {
              Start-Sleep -Seconds 300
          }
