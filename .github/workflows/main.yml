    - name: Configure Desktop & Maintain Connection
      shell: powershell
      run: |
        # 1. Ekran / Görev Çubuğu Öğelerini Küçültme (DPI Scaling & Taskbar)
        Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'TaskbarSmallIcons' -Value 1 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'LogPixels' -Value 96 -ErrorAction SilentlyContinue
        
        # Explorer'ı yeniden başlatarak simgelerin/görev çubuğunun hemen küçülmesini sağla (Yeniden başlatma gerektirmez)
        Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 2
        
        # 2. Bağlantı Bilgilerini Ekrana Yazdır
        
