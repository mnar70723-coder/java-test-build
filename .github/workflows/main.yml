name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          net stop TermService /y
          net start TermService

      - name: Create RDP User
        shell: powershell
        run: |
          $pass = ConvertTo-SecureString "P@ssw0rd2026!SecureRDP" -AsPlainText -Force
          New-LocalUser -Name "RDPAdmin" -Password $pass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPAdmin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPAdmin"
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASS=P@ssw0rd2026!SecureRDP"

      - name: Install Tailscale
        shell: cmd
        run: |
          curl -L -o C:\Users\Public\tailscale.msi https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi
          msiexec /i C:\Users\Public\tailscale.msi /quiet /norestart
          del /f /q C:\Users\Public\tailscale.msi

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID"
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              $tsIP = (tailscale ip -4).Trim()
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP baglantisi saglanamadi. Secret anahtarinizi kontrol edin."
              exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Configure Desktop & Maintain Connection
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RDP BAGLANTISI HAZIR"
          Write-Host "IP Adresi : $env:TAILSCALE_IP"
          Write-Host "Kullanici : RDPAdmin"
          Write-Host "Sifre     : $env:RDP_PASS"
          Write-Host "=========================================="
          
          while ($true) {
              Start-Sleep -Seconds 300
          }
